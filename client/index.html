<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClinicSaathi — Smart clinic, happier patients</title>
    <meta name="description" content="The operating system for modern clinics: appointments, queue, records, billing, follow-ups and growth in one place." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E8A7D" />
    <!-- Sets the theme before the first paint, so a dark-mode visitor never
         gets a flash of the white app. Mirrors the default in useTheme.jsx. -->

     
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('clinicsaathi-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) { /* storage or matchMedia unavailable */ }
      })();
    </script>
    <!-- Instant loader: plain HTML/CSS, painted before any JavaScript runs.
         React replaces it as soon as the app mounts. -->
    <style>
      #boot-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f6fbfa; font-family: Outfit, system-ui, sans-serif; }
      [data-theme="dark"] #boot-splash { background: #0d1418; }
      .boot-mark { width: 44px; height: 44px; border-radius: 12px; background: #0f7c74; animation: boot-pulse 1s ease-in-out infinite; }
      .boot-name { font-size: 20px; font-weight: 700; color: #0f7c74; }
      .boot-bar { width: 140px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(15, 124, 116, 0.2); }
      .boot-bar span { display: block; height: 100%; width: 40%; background: #0f7c74; animation: boot-slide 1s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1); opacity: 1; } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-bar span { animation: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading ClinicSaathi">
        <div class="boot-mark"></div>
        <div class="boot-name">ClinicSaathi</div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
